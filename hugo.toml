baseURL = "https://vpetersson.com"
languageCode = "en"
title = "Viktor's Tech Musings & Security Paranoia"
enableRobotsTXT = true
enableGitInfo = false
timeout = "60s"

[params]
  description = "Insights on DevSecOps, cloud architecture, and building secure, scalable systems. Sharing practical experience from running tech companies and implementing software supply chain security at scale."
  googleAnalytics = "G-ZY6ZNLNNC8"

# Permalink structure to match Jekyll's date permalink style
[permalinks]
  [permalinks.page]
    blog = "/:year/:month/:day/:slug/"
  [permalinks.section]
    blog = "/blog/"
    podcast = "/podcast/"

# Taxonomies
[taxonomies]
  tag = "tags"

# Pagination
[pagination]
  pagerSize = 10

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "monokai"

# Output formats
[outputFormats]
  [outputFormats.VideoSitemap]
    baseName = "video-sitemap"
    mediaType = "application/xml"
    isPlainText = true
  # llms.txt (index) and llms-full.txt (full content) per https://llmstxt.org
  # Rendered from layouts/home.llms.txt and layouts/home.llmsfull.txt
  [outputFormats.llms]
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
  [outputFormats.llmsfull]
    baseName = "llms-full"
    mediaType = "text/plain"
    isPlainText = true
  # A clean Markdown copy of every page, written as index.md next to its
  # index.html, for AI agents. Built in since Hugo 0.146; declared here so
  # older Hugo builds the same. Rendered by layouts/partials/markdown/page.html.
  [outputFormats.markdown]
    baseName = "index"
    mediaType = "text/markdown"
    isPlainText = true
    rel = "alternate"

# Home page output formats
[outputs]
  home = ["HTML", "RSS", "VideoSitemap", "llms", "llmsfull", "markdown"]
  section = ["HTML", "RSS", "markdown"]
  page = ["HTML", "markdown"]
  taxonomy = ["HTML", "RSS", "markdown"]
  term = ["HTML", "RSS", "markdown"]

# Minification
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      version = 2

# Module mounts for node_modules access
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "node_modules/lunr"
    target = "assets/js/vendor/lunr"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Web fonts come from @fontsource-variable packages (managed with bun) and are
  # served from /fonts/. Only the latin subset is published.
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/space-grotesk/files"
    target = "static/fonts"
    files = "space-grotesk-latin-wght-normal.woff2"
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/inter/files"
    target = "static/fonts"
    files = "inter-latin-wght-normal.woff2"
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/jetbrains-mono/files"
    target = "static/fonts"
    files = "jetbrains-mono-latin-wght-normal.woff2"
  [[module.mounts]]
    source = "presentations"
    target = "static/presentations"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

# Related content configuration
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

# Sitemap configuration
[sitemap]
  changeFreq = "monthly"
  priority = 0.5
