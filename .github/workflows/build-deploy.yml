---
name: Build & Deploy

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 1 * * *'  # Run at 1 AM UTC daily
  # Lets a deploy be started from the Actions tab without pushing a commit.
  workflow_dispatch:

# One Pages deploy at a time; a newer run waits rather than racing the older one.
concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are separate jobs, as in GitHub's Pages starter workflow.
# In one job, "Re-run failed jobs" rebuilt and re-uploaded the site, leaving
# two "github-pages" artifacts on the run, which deploy-pages refuses to pick
# between. It also started the deploy before the upload was visible to the
# artifact API. Now the deploy job starts only once the upload is done, and
# re-running it reuses the existing artifact.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        env:
          HUGO_VERSION: "0.157.0"
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo mv hugo /usr/local/bin/hugo
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          hugo version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: hugo --minify

      - name: Install xq
        env:
          XQ_VERSION: "1.3.0"
        run: |
          wget -q "https://github.com/sibprogrammer/xq/releases/download/v${XQ_VERSION}/xq_${XQ_VERSION}_linux_amd64.tar.gz"
          tar -xzf "xq_${XQ_VERSION}_linux_amd64.tar.gz" xq
          sudo mv xq /usr/local/bin/xq
          rm "xq_${XQ_VERSION}_linux_amd64.tar.gz"

      - name: Validate XML sitemaps
        run: |
          xq . public/sitemap.xml > /dev/null
          xq . public/video-sitemap.xml > /dev/null

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # llms.txt, llms-full.txt and the per-page index.md copies are
          # excluded: they contain raw Markdown (including quoted emails and
          # URL-like strings in old posts) that lychee scans as plaintext;
          # every real link in them also exists in the HTML pages.
          args: --no-progress --offline --root-dir ${{ github.workspace }}/public --exclude-path '${{ github.workspace }}/public/llms.txt' --exclude-path '${{ github.workspace }}/public/llms-full.txt' --exclude-path 'index\.md$' ${{ github.workspace }}/public
          fail: true

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    name: Deploy
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
